<title>Diario de dieta</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: una columna estrecha tipo libreta — marcador del día arriba, porcentajes, calendario del mes, historial. */
:root {
  --bg: #f3f6f2;
  --surface: #ffffff;
  --fg: #18211b;
  --muted: #5d6b61;
  --line: #dbe3dc;
  --ok: #2f8a4e;
  --ok-soft: #d9efe0;
  --fail: #d0482f;
  --fail-soft: #f8ddd6;
  --accent: #1f5a37;
  --font-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121714; --surface: #1a211c; --fg: #e8efe9; --muted: #9aaa9f; --line: #2b352e;
    --ok: #5cc27f; --ok-soft: #1f3a29; --fail: #f07a62; --fail-soft: #43231c; --accent: #8fd6a6;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121714; --surface: #1a211c; --fg: #e8efe9; --muted: #9aaa9f; --line: #2b352e;
  --ok: #5cc27f; --ok-soft: #1f3a29; --fail: #f07a62; --fail-soft: #43231c; --accent: #8fd6a6;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.5;
}
.wrap {
  max-width: 560px; margin: 0 auto;
  padding-block: 28px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 22px;
}
h1, h2 { font-family: var(--font-display); margin: 0; text-wrap: balance; }
h1 { font-size: 2rem; font-weight: 800; letter-spacing: -0.02em; }
h2 { font-size: 1.05rem; font-weight: 600; }
.sub { color: var(--muted); margin: 4px 0 0; }
.label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
.tnum { font-variant-numeric: tabular-nums; }

/* Registro del día */
.log { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.log-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.log-head input[type=date] {
  font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px;
}
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.choice {
  font: 600 1rem var(--font-body); padding: 16px 10px; border-radius: 12px; cursor: pointer;
  border: 2px solid var(--line); background: var(--surface); color: var(--fg);
  display: flex; flex-direction: column; align-items: center; gap: 2px; transition: background .15s, border-color .15s;
}
.choice .big { font-family: var(--font-display); font-size: 1.6rem; line-height: 1; }
.choice.ok:hover, .choice.ok[aria-pressed="true"] { border-color: var(--ok); background: var(--ok-soft); }
.choice.fail:hover, .choice.fail[aria-pressed="true"] { border-color: var(--fail); background: var(--fail-soft); }
.choice.ok .big { color: var(--ok); }
.choice.fail .big { color: var(--fail); }
.choice:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row input[type=text] {
  flex: 1 1 200px; min-width: 0; font: inherit; color: var(--fg); background: var(--bg);
  border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
}
.link { background: none; border: 0; color: var(--muted); font: inherit; text-decoration: underline; cursor: pointer; padding: 4px; }
.status { min-height: 1.3em; font-size: 0.85rem; color: var(--muted); }

/* Resultados */
.stats-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.stats-head select { font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.stat { display: flex; flex-direction: column; gap: 2px; }
.stat .pct { font-family: var(--font-display); font-weight: 800; font-size: 3rem; line-height: 1; letter-spacing: -0.03em; }
.stat.ok .pct { color: var(--ok); }
.stat.fail .pct { color: var(--fail); }
.stat .count { color: var(--muted); font-size: 0.9rem; }
.bar { height: 12px; border-radius: 6px; background: var(--line); display: flex; overflow: hidden; }
.bar span { display: block; height: 100%; transition: width .3s; }
.bar .b-ok { background: var(--ok); }
.bar .b-fail { background: var(--fail); }
.extra { display: flex; gap: 18px; flex-wrap: wrap; color: var(--muted); font-size: 0.9rem; }
.extra b { color: var(--fg); font-weight: 600; }

/* Calendario */
.cal-head { display: flex; justify-content: space-between; align-items: center; }
.cal-head button { background: var(--surface); border: 1px solid var(--line); color: var(--fg); border-radius: 8px; width: 34px; height: 34px; cursor: pointer; font-size: 1rem; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-top: 10px; }
.cal .dow { text-align: center; font-size: 0.7rem; color: var(--muted); font-weight: 600; letter-spacing: 0.06em; }
.day {
  aspect-ratio: 1; max-width: 100%; border-radius: 8px; border: 1px solid var(--line); background: var(--surface);
  color: var(--fg); font: 500 0.85rem var(--font-body); cursor: pointer; padding: 0;
  display: flex; align-items: center; justify-content: center;
}
.day.ok { background: var(--ok); border-color: var(--ok); color: var(--surface); font-weight: 600; }
.day.fail { background: var(--fail); border-color: var(--fail); color: var(--surface); font-weight: 600; }
.day.today { outline: 2px solid var(--fg); outline-offset: 1px; }
.day.sel { box-shadow: inset 0 0 0 2px var(--accent); }
.day.future { opacity: .35; cursor: default; }
.day.blank { visibility: hidden; }
.legend { display: flex; gap: 14px; font-size: 0.8rem; color: var(--muted); margin-top: 8px; flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: middle; }

/* Historial */
.hist { list-style: none; margin: 8px 0 0; padding: 0; border-top: 1px solid var(--line); }
.hist li { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: baseline; padding: 9px 0; border-bottom: 1px solid var(--line); }
.hist .pill { font-size: 0.72rem; font-weight: 600; padding: 2px 8px; border-radius: 99px; }
.hist .pill.ok { background: var(--ok-soft); color: var(--ok); }
.hist .pill.fail { background: var(--fail-soft); color: var(--fail); }
.hist .note { color: var(--muted); min-width: 0; overflow-wrap: anywhere; }
.hist .d { font-size: 0.85rem; color: var(--muted); }
.empty { color: var(--muted); padding: 14px 0; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header>
    <h1>Diario de dieta</h1>
    <p class="sub">Marca cada día si cumpliste o fallaste. Los porcentajes se calculan solos.</p>
  </header>

  <section class="log" aria-label="Registrar un día">
    <div class="log-head">
      <span class="label" id="logLabel">Hoy</span>
      <input type="date" id="dateInput" aria-label="Fecha a registrar">
    </div>
    <div class="choices">
      <button class="choice ok" id="btnOk" aria-pressed="false"><span class="big">✓</span>Cumplido</button>
      <button class="choice fail" id="btnFail" aria-pressed="false"><span class="big">✕</span>Fallado</button>
    </div>
    <div class="row">
      <input type="text" id="noteInput" placeholder="Nota opcional (p. ej. cena con amigos)" maxlength="140">
      <button class="link" id="btnClear" hidden>Borrar este día</button>
    </div>
    <div class="status" id="status" role="status"></div>
  </section>

  <section aria-label="Resultados">
    <div class="stats-head">
      <h2>Resultados</h2>
      <select id="range" aria-label="Periodo">
        <option value="all">Desde el principio</option>
        <option value="month">Este mes</option>
        <option value="30">Últimos 30 días</option>
        <option value="7">Últimos 7 días</option>
      </select>
    </div>
    <div class="stats" style="margin-top:12px">
      <div class="stat ok"><span class="label">Cumplidos</span><span class="pct tnum" id="pctOk">–</span><span class="count tnum" id="cntOk"></span></div>
      <div class="stat fail"><span class="label">Fallados</span><span class="pct tnum" id="pctFail">–</span><span class="count tnum" id="cntFail"></span></div>
    </div>
    <div class="bar" style="margin-top:12px" aria-hidden="true"><span class="b-ok" id="barOk" style="width:0"></span><span class="b-fail" id="barFail" style="width:0"></span></div>
    <div class="extra" style="margin-top:10px">
      <span>Días apuntados: <b class="tnum" id="total">0</b></span>
      <span>Racha actual: <b class="tnum" id="streak">0</b></span>
      <span>Mejor racha: <b class="tnum" id="best">0</b></span>
    </div>
  </section>

  <section aria-label="Calendario">
    <div class="cal-head">
      <button id="prevM" aria-label="Mes anterior">‹</button>
      <h2 id="monthTitle"></h2>
      <button id="nextM" aria-label="Mes siguiente">›</button>
    </div>
    <div class="cal" id="cal"></div>
    <div class="legend"><span><i style="background:var(--ok)"></i>Cumplido</span><span><i style="background:var(--fail)"></i>Fallado</span><span>Toca un día para registrarlo</span></div>
  </section>

  <section aria-label="Historial">
    <h2>Historial</h2>
    <ul class="hist" id="hist"></ul>
  </section>
</div>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const pad = (n) => String(n).padStart(2, "0");
  const key = (d) => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  const parse = (k) => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
  const todayKey = () => key(new Date());
  const fmtLong = new Intl.DateTimeFormat("es-ES", { weekday: "long", day: "numeric", month: "long" });
  const fmtShort = new Intl.DateTimeFormat("es-ES", { weekday: "short", day: "numeric", month: "short", year: "numeric" });
  const fmtMonth = new Intl.DateTimeFormat("es-ES", { month: "long", year: "numeric" });

  let entries = {};          // { "2026-11-08": {status:"ok"|"fail", note:""} }
  let selected = todayKey();
  let viewMonth = new Date(); viewMonth.setDate(1);
  let store = null;          // db collection or null (localStorage fallback)
  let readOnly = false;
  const LS = "diario-dieta-v1";

  function lsLoad() { try { return JSON.parse(localStorage.getItem(LS) || "{}"); } catch (e) { return {}; } }
  function lsSave() { try { localStorage.setItem(LS, JSON.stringify(entries)); } catch (e) {} }

  function setStatus(t) { $("status").textContent = t; }

  async function save(k, status, note) {
    if (readOnly) { setStatus("Solo lectura: no puedes cambiar este diario."); return; }
    const prev = entries[k];
    if (status) entries[k] = { status, note: note || "" }; else delete entries[k];
    render();
    if (!store) { lsSave(); setStatus(status ? "Guardado en este navegador." : "Día borrado."); return; }
    try {
      if (status) await store.doc(k).set({ date: k, status, note: note || "" });
      else await store.doc(k).delete();
      setStatus(status ? "Guardado." : "Día borrado.");
    } catch (e) {
      if (prev) entries[k] = prev; else delete entries[k];
      render();
      if (e && e.code === "invalid_argument") { readOnly = true; setStatus("No tienes permiso para editar este diario."); }
      else setStatus("No se pudo guardar. Inténtalo de nuevo.");
    }
  }

  function inRange(k, range) {
    if (range === "all") return true;
    const d = parse(k), now = new Date(); now.setHours(0, 0, 0, 0);
    if (range === "month") return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
    const n = Number(range); const from = new Date(now); from.setDate(now.getDate() - (n - 1));
    return d >= from && d <= now;
  }

  function streaks() {
    const keys = Object.keys(entries).sort();
    let best = 0, run = 0, prev = null;
    for (const k of keys) {
      const d = parse(k);
      const consecutive = prev && Math.round((d - prev) / 864e5) === 1;
      if (entries[k].status === "ok") run = consecutive ? run + 1 : 1;
      else run = 0;
      best = Math.max(best, run); prev = d;
    }
    // racha actual: días seguidos cumplidos terminando hoy o ayer
    let cur = 0; const d = new Date(); d.setHours(0, 0, 0, 0);
    if (!entries[key(d)]) d.setDate(d.getDate() - 1);
    while (entries[key(d)] && entries[key(d)].status === "ok") { cur++; d.setDate(d.getDate() - 1); }
    return { cur, best };
  }

  function renderStats() {
    const range = $("range").value;
    let ok = 0, fail = 0;
    for (const k in entries) if (inRange(k, range)) entries[k].status === "ok" ? ok++ : fail++;
    const total = ok + fail;
    const pOk = total ? Math.round((ok / total) * 1000) / 10 : 0;
    const pFail = total ? Math.round((100 - pOk) * 10) / 10 : 0;
    $("pctOk").textContent = total ? pOk.toLocaleString("es-ES") + "%" : "–";
    $("pctFail").textContent = total ? pFail.toLocaleString("es-ES") + "%" : "–";
    $("cntOk").textContent = ok + (ok === 1 ? " día" : " días");
    $("cntFail").textContent = fail + (fail === 1 ? " día" : " días");
    $("barOk").style.width = (total ? (ok / total) * 100 : 0) + "%";
    $("barFail").style.width = (total ? (fail / total) * 100 : 0) + "%";
    $("total").textContent = total;
    const s = streaks();
    $("streak").textContent = s.cur + (s.cur === 1 ? " día" : " días");
    $("best").textContent = s.best + (s.best === 1 ? " día" : " días");
  }

  function renderLog() {
    const e = entries[selected];
    const isToday = selected === todayKey();
    $("logLabel").textContent = isToday ? "Hoy · " + fmtLong.format(parse(selected)) : fmtLong.format(parse(selected));
    $("dateInput").value = selected;
    $("dateInput").max = todayKey();
    $("btnOk").setAttribute("aria-pressed", String(!!e && e.status === "ok"));
    $("btnFail").setAttribute("aria-pressed", String(!!e && e.status === "fail"));
    if (document.activeElement !== $("noteInput")) $("noteInput").value = e ? e.note || "" : "";
    $("btnClear").hidden = !e;
    [$("btnOk"), $("btnFail"), $("noteInput"), $("btnClear")].forEach((el) => (el.disabled = readOnly));
  }

  function renderCal() {
    const mt = fmtMonth.format(viewMonth); $("monthTitle").textContent = mt.charAt(0).toUpperCase() + mt.slice(1);
    const cal = $("cal"); cal.textContent = "";
    ["L", "M", "X", "J", "V", "S", "D"].forEach((d) => { const s = document.createElement("div"); s.className = "dow"; s.textContent = d; cal.appendChild(s); });
    const y = viewMonth.getFullYear(), m = viewMonth.getMonth();
    const offset = (new Date(y, m, 1).getDay() + 6) % 7;
    const days = new Date(y, m + 1, 0).getDate();
    const tk = todayKey();
    for (let i = 0; i < offset; i++) { const b = document.createElement("div"); b.className = "day blank"; cal.appendChild(b); }
    for (let d = 1; d <= days; d++) {
      const k = y + "-" + pad(m + 1) + "-" + pad(d);
      const b = document.createElement("button");
      b.className = "day tnum";
      b.textContent = d;
      const e = entries[k];
      if (e) b.classList.add(e.status);
      if (k === tk) b.classList.add("today");
      if (k === selected) b.classList.add("sel");
      if (k > tk) { b.classList.add("future"); b.disabled = true; }
      b.setAttribute("aria-label", fmtLong.format(parse(k)) + (e ? (e.status === "ok" ? ", cumplido" : ", fallado") : ", sin apuntar"));
      b.addEventListener("click", () => { selected = k; setStatus(""); render(); document.querySelector(".log").scrollIntoView({ behavior: "smooth", block: "nearest" }); });
      cal.appendChild(b);
    }
    const next = new Date(y, m + 1, 1);
    $("nextM").disabled = next > new Date();
  }

  function renderHist() {
    const ul = $("hist"); ul.textContent = "";
    const keys = Object.keys(entries).sort().reverse().slice(0, 60);
    if (!keys.length) {
      const li = document.createElement("li"); li.className = "empty"; li.style.display = "block";
      li.textContent = "Todavía no hay días apuntados. Pulsa «Cumplido» o «Fallado» arriba para empezar.";
      ul.appendChild(li); return;
    }
    for (const k of keys) {
      const e = entries[k];
      const li = document.createElement("li");
      const pill = document.createElement("span"); pill.className = "pill " + e.status; pill.textContent = e.status === "ok" ? "Cumplido" : "Fallado";
      const note = document.createElement("span"); note.className = "note"; note.textContent = e.note || "";
      const d = document.createElement("span"); d.className = "d tnum"; d.textContent = fmtShort.format(parse(k));
      li.append(pill, note, d); ul.appendChild(li);
    }
  }

  function render() { renderLog(); renderStats(); renderCal(); renderHist(); }

  $("btnOk").addEventListener("click", () => save(selected, "ok", $("noteInput").value.trim()));
  $("btnFail").addEventListener("click", () => save(selected, "fail", $("noteInput").value.trim()));
  $("btnClear").addEventListener("click", () => save(selected, null));
  $("noteInput").addEventListener("change", () => {
    const e = entries[selected];
    if (e && (e.note || "") !== $("noteInput").value.trim()) save(selected, e.status, $("noteInput").value.trim());
  });
  $("dateInput").addEventListener("change", (ev) => {
    const v = ev.target.value; if (!v || v > todayKey()) return;
    selected = v; const d = parse(v); viewMonth = new Date(d.getFullYear(), d.getMonth(), 1); setStatus(""); render();
  });
  $("range").addEventListener("change", renderStats);
  $("prevM").addEventListener("click", () => { viewMonth = new Date(viewMonth.getFullYear(), viewMonth.getMonth() - 1, 1); renderCal(); });
  $("nextM").addEventListener("click", () => { viewMonth = new Date(viewMonth.getFullYear(), viewMonth.getMonth() + 1, 1); renderCal(); });

  // Arranque: localStorage al instante; si el diario compartido (db) está disponible, se usa ese.
  entries = lsLoad();
  render();

  (async function connect() {
    if (!window.claude || !window.claude.use) return;
    let db = null, user = null;
    try { [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]); } catch (e) { return; }
    if (!db) return;
    store = db.collection("days");
    try { const canWrite = user ? await user.can("data.write") : null; if (canWrite === false) readOnly = true; } catch (e) {}
    setStatus("Cargando tu diario…");
    const timer = setTimeout(() => setStatus("No se puede conectar todavía; los datos pueden no estar al día."), 10000);
    store.onSnapshot((snap) => {
      const next = {};
      snap.docs.forEach((d) => { const v = d.data(); if (v && (v.status === "ok" || v.status === "fail")) next[d.id] = { status: v.status, note: v.note || "" }; });
      entries = next;
      if (!snap.metadata.fromCache) { clearTimeout(timer); if ($("status").textContent.startsWith("Cargando") || $("status").textContent.startsWith("No se puede")) setStatus(""); }
      render();
    }, () => { clearTimeout(timer); setStatus("No se pudo cargar el diario."); });
  })();
})();
</script>
